<!DOCTYPE html>
<html lang="uz-Latn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yangi Alif — Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../assets/logo.png">
<script src="../assets/theme-init.js"></script>
<style>
  :root{
    --brand:#487830; --brand-dark:#2C5220; --brand-light:#7AAA50;
    --pale:#F2F7EE; --border:#CDE0C4; --ink:#262E22; --muted:#6C7668;
    --surface:#FFFFFF; --surface-2:#FAFCF8; --accent-deep:#2C5220;
    --danger:#B3261E; --danger-bg:#FDECEA;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --brand:#7AAA50; --brand-dark:#A8D082; --brand-light:#8FC15E;
      --pale:#1B2416; --border:#2E3B26; --ink:#EAF0E4; --muted:#96A38C;
      --surface:#12160E; --surface-2:#171C11;
      --danger:#FF6B6B; --danger-bg:#2B1614;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --brand:#7AAA50; --brand-dark:#A8D082; --brand-light:#8FC15E;
    --pale:#1B2416; --border:#2E3B26; --ink:#EAF0E4; --muted:#96A38C;
    --surface:#12160E; --surface-2:#171C11;
    --danger:#FF6B6B; --danger-bg:#2B1614;
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--surface-2); color:var(--ink);
    font-family:"Segoe UI", system-ui, -apple-system, sans-serif;
  }
  .top{display:flex; align-items:center; justify-content:space-between; padding:16px 24px; border-bottom:1px solid var(--border); background:var(--surface);}
  .brand{display:flex; align-items:center; gap:10px; font-weight:700;}
  .brand img{width:28px; height:28px; border-radius:8px;}
  .wrap{max-width:880px; margin:0 auto; padding:40px 24px 80px;}

  /* ---------- Kirish oynasi ---------- */
  .gate{max-width:360px; margin:80px auto; text-align:center;}
  .gate.hidden{display:none;}
  .gate h1{font-size:20px; margin:0 0 6px;}
  .gate p{color:var(--muted); font-size:14px; margin:0 0 24px;}
  input[type="password"]{
    width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--border);
    background:var(--surface); color:var(--ink); font-size:15px; margin-bottom:12px;
  }
  input[type="password"]:focus{outline:2px solid var(--brand-light); outline-offset:1px;}
  button{
    width:100%; padding:12px 14px; border-radius:10px; border:none; cursor:pointer;
    background:var(--brand); color:#fff; font-weight:700; font-size:15px;
  }
  button:hover{background:var(--brand-dark);}
  button:disabled{opacity:.6; cursor:default;}
  .error{
    margin-top:14px; padding:10px 12px; border-radius:8px; background:var(--danger-bg);
    color:var(--danger); font-size:13.5px; display:none;
  }
  .error.show{display:block;}

  /* ---------- Dashboard ---------- */
  .dash{display:none;}
  .dash.show{display:block;}
  .head-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:28px;}
  .head-row h1{font-size:22px; margin:0;}
  .ghost-btn{
    width:auto; background:var(--surface); color:var(--muted); border:1px solid var(--border);
    padding:8px 14px; font-size:13px; font-weight:600;
  }
  .ghost-btn:hover{background:var(--pale); color:var(--ink);}
  .cards{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:28px;}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:20px;}
  .card .label{font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin-bottom:10px;}
  .card .num{font-size:34px; font-weight:800; color:var(--brand-dark);}
  .panel{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:24px;}
  .panel h2{font-size:15px; margin:0 0 18px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; font-weight:800;}
  .chart{display:flex; align-items:flex-end; gap:6px; height:160px;}
  .chart .col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:4px;}
  .chart .bar-stack{width:100%; max-width:26px; display:flex; flex-direction:column; justify-content:flex-end; height:130px; border-radius:4px 4px 0 0; overflow:hidden; background:var(--pale);}
  .chart .bar-exe{background:var(--brand); width:100%;}
  .chart .bar-zip{background:var(--brand-light); width:100%;}
  .chart .day-label{font-size:9.5px; color:var(--muted); writing-mode:vertical-rl; transform:rotate(180deg); height:34px;}
  .legend{display:flex; gap:18px; margin-top:14px; font-size:12.5px; color:var(--muted);}
  .legend span{display:inline-flex; align-items:center; gap:6px;}
  .legend i{width:10px; height:10px; border-radius:3px; display:inline-block;}
  .empty-note{color:var(--muted); font-size:13.5px; text-align:center; padding:30px 0;}
</style>
</head>
<body>

<div class="top">
  <div class="brand"><img src="../assets/logo.png" alt=""> Yangi Alif — Admin</div>
  <a href="../" class="ghost-btn" style="text-decoration:none; display:inline-block; width:auto;">← Saytga qaytish</a>
</div>

<div class="wrap">

  <div class="gate" id="gate">
    <h1>Admin panel</h1>
    <p>Yuklamalar statistikasini ko'rish uchun parolni kiriting.</p>
    <input type="password" id="pwInput" placeholder="Parol" autocomplete="current-password">
    <button id="loginBtn" type="button">Kirish</button>
    <div class="error" id="loginError"></div>
  </div>

  <div class="dash" id="dash">
    <div class="head-row">
      <h1>Yuklamalar statistikasi</h1>
      <button class="ghost-btn" id="logoutBtn" type="button">Chiqish</button>
    </div>

    <div class="cards">
      <div class="card">
        <div class="label">Jami yuklamalar</div>
        <div class="num" id="statTotal">—</div>
      </div>
      <div class="card">
        <div class="label">.exe (o'rnatuvchi)</div>
        <div class="num" id="statExe">—</div>
      </div>
      <div class="card">
        <div class="label">Portable (.zip)</div>
        <div class="num" id="statZip">—</div>
      </div>
    </div>

    <div class="panel">
      <h2>Oxirgi 14 kun</h2>
      <div class="chart" id="chart"></div>
      <div class="legend">
        <span><i style="background:var(--brand)"></i> .exe</span>
        <span><i style="background:var(--brand-light)"></i> .zip</span>
      </div>
    </div>
  </div>

</div>

<script src="../assets/admin.js"></script>
</body>
</html>
