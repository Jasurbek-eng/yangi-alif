<!DOCTYPE html>
<html lang="uz-Latn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sahifa topilmadi — Yangi Alif</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/logo.png">
<script src="/assets/theme-init.js"></script>
<style>
  :root{
    --brand:#487830; --brand-dark:#2C5220; --brand-light:#7AAA50;
    --pale:#F2F7EE; --border:#CDE0C4; --ink:#262E22; --muted:#6C7668;
    --surface:#FFFFFF; --surface-2:#FAFCF8; --accent-deep:#2C5220;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --brand:#7AAA50; --brand-dark:#A8D082; --brand-light:#8FC15E;
      --pale:#1B2416; --border:#2E3B26; --ink:#EAF0E4; --muted:#96A38C;
      --surface:#12160E; --surface-2:#171C11;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --brand:#7AAA50; --brand-dark:#A8D082; --brand-light:#8FC15E;
    --pale:#1B2416; --border:#2E3B26; --ink:#EAF0E4; --muted:#96A38C;
    --surface:#12160E; --surface-2:#171C11;
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--surface); color:var(--ink); text-align:center; padding:24px;
    font-family:"Segoe UI", system-ui, -apple-system, sans-serif;
  }
  .box{max-width:460px;}
  img{width:72px; height:72px; margin:0 auto 22px; display:block; border-radius:18px;}
  .code{font-size:13px; font-weight:800; letter-spacing:.08em; color:var(--muted); text-transform:uppercase;}
  h1{font-size:28px; margin:10px 0 12px;}
  p{color:var(--muted); font-size:15.5px; line-height:1.6; margin:0 0 28px;}
  .btn{
    display:inline-flex; align-items:center; gap:8px; padding:13px 26px; border-radius:11px;
    font-weight:700; font-size:15px; text-decoration:none; color:#fff;
    background:linear-gradient(135deg, var(--brand-light), var(--brand));
    box-shadow:0 8px 20px -8px rgba(72,120,48,.55);
  }
  .btn:hover{transform:translateY(-1px);}
  .links{margin-top:22px; font-size:14px;}
  .links a{color:var(--brand); text-decoration:none; margin:0 10px;}
  .links a:hover{text-decoration:underline;}
</style>
</head>
<body>
  <div class="box">
    <img src="/assets/logo.png" alt="Yangi Alif">
    <div class="code">404</div>
    <h1>Bunday sahifa yo'q</h1>
    <p>Manzil noto'g'ri yozilgan bo'lishi yoki sahifa ko'chirilgan bo'lishi mumkin.</p>
    <a class="btn" href="/">Bosh sahifaga qaytish</a>
    <div class="links">
      <a href="/#yuklab-olish">Yuklab olish</a>
      <a href="/#faq">Savol-javob</a>
      <a href="https://t.me/khasanov_jasur">Telegram</a>
    </div>
  </div>
</body>
</html>
